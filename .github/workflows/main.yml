name: iOSProfileBuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Updated to v4
      - uses: actions/checkout@v4

      # Updated to v4 (Java 12 is EOL; using 17 as a modern stable default)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' 
          java-version: '17'

      # Updated to v2 (The current recommended version for Flutter)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Added caching to make your builds faster

      - run: flutter pub get

      - name: Build iOS App
        run: |
          flutter build ios --profile --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      # Updated to v4 (Significantly faster upload speeds)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: profile-ipa
          path: build/ios/iphoneos/app.ipa
